# Include inside the dashboard's existing HTTPS server block.
# Vite's proxy is not included in the static dist build.
location /api/ {
    proxy_pass http://16.178.137.42/finis-backend/;
    proxy_http_version 1.1;
    proxy_set_header Host 16.178.137.42;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /socket.io/ {
    proxy_pass http://16.178.137.42/finis-backend/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Host 16.178.137.42;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
}
