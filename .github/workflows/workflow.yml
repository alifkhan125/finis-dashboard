name: Frontend Deploy Pipeline 

on:
    push:
        branches: 
            - build

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Pnpm
              uses: pnpm/action-setup@v4
              with: 
                 version: 9

            - name: Install Dependencies
              run: pnpm install

            - name: Build Project
              run: pnpm run build

            - name: Deploy & Build on AWS VPS
              uses: appleboy/ssh-action@v1.0.3
              with: 
                host: ${{secrets.VPS_HOST}}
                username: ${{secrets.VPS_USER}}
                key: ${{secrets.VPS_SSH_KEY}}
                script: |
                    export NVM_DIR="$HOME/.nvm"
                    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                    [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
                    export PNPM_HOME="$HOME/.local/share/pnpm"
                    export PATH="$PNPM_HOME:$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin"
                    cd /var/www/finis-dashboard
                    git pull origin build
                    rm -rf dist node_modules/.vite
                    pnpm install
                    pnpm run build
                    sudo systemctl reload nginx
                    pm2 restart all
